<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">How loupe opens an image</title>
<desc id="desc">A thumbnail's view button opens the in-Claude pane as a preview. Inside herdr, /loupe or f (full) in that pane splits a herdr pane, zooms it over the window and runs bin/loupe-view, which draws with the kitty graphics protocol and crops with sips. Outside herdr, /loupe opens the in-Claude pane; when a herdr step fails, the split pane is closed.</desc>
<style>.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.b{font-weight:600}.cap{font-size:14px;letter-spacing:1.2px;font-weight:600}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#59636E"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#B4690E"/></marker></defs>
<rect width="1100" height="380" fill="#FFFFFF"/>
<text x="40" y="44" class="sans cap" fill="#59636E">OPEN</text>
<text x="330" y="44" class="sans cap" fill="#59636E">HERDR (HERDR_ENV=1)</text>
<text x="740" y="44" class="sans cap" fill="#59636E">VIEWER</text>
<rect x="40" y="70" width="240" height="110" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="58" y="100" class="sans b" font-size="17" fill="#1F2328">Full screen</text>
<text x="58" y="124" class="mono" font-size="13" fill="#59636E">/loupe</text>
<text x="58" y="145" class="mono" font-size="13" fill="#59636E">f / ⛶ full in the pane</text>
<text x="58" y="166" class="mono" font-size="13" fill="#59636E">(the pane opens from ⤢)</text>
<rect x="330" y="70" width="360" height="110" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="348" y="100" class="sans b" font-size="17" fill="#1F2328">Split + zoom a pane</text>
<text x="348" y="124" class="mono" font-size="13" fill="#59636E">herdr pane split --focus</text>
<text x="348" y="145" class="mono" font-size="13" fill="#59636E">herdr pane zoom --on</text>
<text x="348" y="166" class="mono" font-size="13" fill="#59636E">herdr pane run loupe-view …</text>
<rect x="740" y="70" width="320" height="110" rx="10" fill="#FFF4DE" stroke="#E7C27D" stroke-width="1.5"/>
<text x="758" y="100" class="sans b" font-size="17" fill="#B4690E">bin/loupe-view</text>
<text x="758" y="124" class="mono" font-size="13" fill="#59636E">kitty graphics, a=T,f=100,t=f</text>
<text x="758" y="145" class="mono" font-size="13" fill="#59636E">zoom = sips crop</text>
<text x="758" y="166" class="mono" font-size="13" fill="#59636E">keys + SGR mouse</text>
<rect x="740" y="240" width="320" height="110" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="758" y="270" class="sans b" font-size="17" fill="#1F2328">In-Claude pane</text>
<text x="758" y="294" class="mono" font-size="13" fill="#59636E">Claude Code pane (≤ 45%)</text>
<text x="758" y="315" class="mono" font-size="13" fill="#59636E">zoom = sips crop</text>
<text x="758" y="336" class="mono" font-size="13" fill="#59636E">keys + buttons</text>
<path d="M280,125 H326" stroke="#59636E" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M690,125 H736" stroke="#B4690E" stroke-width="1.5" fill="none" marker-end="url(#aha)"/>
<path d="M160,180 V295 H736" stroke="#59636E" stroke-width="1.5" fill="none" stroke-dasharray="5 5" marker-end="url(#ah)"/>
<path d="M510,180 V295" stroke="#59636E" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/>
<text x="176" y="285" class="sans" font-size="14" fill="#59636E">⤢ view #n, or not in herdr</text>
<text x="526" y="285" class="sans" font-size="14" fill="#59636E">a step fails: close the pane</text>
<style>.fx .h{fill:var(--k,#B4690E);opacity:.28}.fx .c{fill:var(--k,#B4690E)}.fx .pko .h{opacity:.14}.fx .pko .c{opacity:.6}.fx .eg{fill:none;stroke:#B4690E;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.fx .ego{fill:none;stroke:#B4690E;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}.fx .bx{fill:none;stroke:#B4690E;stroke-width:2.5}.fx .rg{fill:none;stroke:#B4690E;stroke-width:1.5}@keyframes march{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fx *{animation:none!important}}@keyframes b1{0%{opacity:0}1.5%{opacity:0.35}3.75%{opacity:0.35}10%{opacity:0}100%{opacity:0}}.b1{animation:b1 8.0s ease-in-out infinite}@keyframes e2{0%{opacity:0}3.75%{opacity:0}5.25%{opacity:0.35}26.25%{opacity:0.35}30.63%{opacity:0}100%{opacity:0}}.e2{animation:e2 8.0s linear infinite,march .8s linear infinite}@keyframes p3{0%{opacity:0;transform:translate(160px,180px)}3.75%{opacity:0;transform:translate(160px,180px)}5.25%{opacity:1}7.49%{transform:translate(160px,295px)}24.75%{opacity:1}26.25%{transform:translate(736px,295px);opacity:0}100%{opacity:0;transform:translate(736px,295px)}}.p3{animation:p3 8.0s linear infinite}@keyframes b4{0%{opacity:0}26.25%{opacity:0}27.75%{opacity:0.7}32.5%{opacity:0.7}38.75%{opacity:0}100%{opacity:0}}.b4{animation:b4 8.0s ease-in-out infinite}@keyframes b5{0%{opacity:0}37.5%{opacity:0}39%{opacity:0.7}41.25%{opacity:0.7}47.5%{opacity:0}100%{opacity:0}}.b5{animation:b5 8.0s ease-in-out infinite}@keyframes e6{0%{opacity:0}41.25%{opacity:0}42.75%{opacity:0.45}47.5%{opacity:0.45}51.87%{opacity:0}100%{opacity:0}}.e6{animation:e6 8.0s linear infinite}@keyframes p7{0%{opacity:0;transform:translate(280px,125px)}41.25%{opacity:0;transform:translate(280px,125px)}42.75%{opacity:1}46%{opacity:1}47.5%{transform:translate(326px,125px);opacity:0}100%{opacity:0;transform:translate(326px,125px)}}.p7{animation:p7 8.0s linear infinite}@keyframes b8{0%{opacity:0}47.5%{opacity:0}49%{opacity:0.7}52.5%{opacity:0.7}58.75%{opacity:0}100%{opacity:0}}.b8{animation:b8 8.0s ease-in-out infinite}@keyframes e9{0%{opacity:0}52.5%{opacity:0}54%{opacity:0.45}58.75%{opacity:0.45}63.12%{opacity:0}100%{opacity:0}}.e9{animation:e9 8.0s linear infinite}@keyframes p10{0%{opacity:0;transform:translate(690px,125px)}52.5%{opacity:0;transform:translate(690px,125px)}54%{opacity:1}57.25%{opacity:1}58.75%{transform:translate(736px,125px);opacity:0}100%{opacity:0;transform:translate(736px,125px)}}.p10{animation:p10 8.0s linear infinite}@keyframes b11{0%{opacity:0}58.75%{opacity:0}60.25%{opacity:0.7}66.25%{opacity:0.7}72.5%{opacity:0}100%{opacity:0}}.b11{animation:b11 8.0s ease-in-out infinite}@keyframes e12{0%{opacity:0}72.5%{opacity:0}74%{opacity:0.35}88.75%{opacity:0.35}93.12%{opacity:0}100%{opacity:0}}.e12{animation:e12 8.0s linear infinite,march .8s linear infinite}@keyframes p13{0%{opacity:0;transform:translate(510px,180px)}72.5%{opacity:0;transform:translate(510px,180px)}74%{opacity:1}77.98%{transform:translate(510px,295px)}87.25%{opacity:1}88.75%{transform:translate(736px,295px);opacity:0}100%{opacity:0;transform:translate(736px,295px)}}.p13{animation:p13 8.0s linear infinite}</style>
<g class="fx" aria-hidden="true"><rect class="bx b1" opacity="0" x="40" y="70" width="240" height="110" rx="10"/><path class="ego e2" d="M160,180 L160,295 L736,295" opacity="0"/><g class="pko p3" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b4" opacity="0" x="740" y="240" width="320" height="110" rx="10"/><rect class="bx b5" opacity="0" x="40" y="70" width="240" height="110" rx="10"/><path class="eg e6" d="M280,125 L326,125" opacity="0"/><g class="pk p7" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b8" opacity="0" x="330" y="70" width="360" height="110" rx="10"/><path class="eg e9" d="M690,125 L736,125" opacity="0"/><g class="pk p10" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b11" opacity="0" x="740" y="70" width="320" height="110" rx="10"/><path class="ego e12" d="M510,180 L510,295 L736,295" opacity="0"/><g class="pko p13" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g></g>
</svg>
